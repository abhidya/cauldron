[package]
name = "cauldron"
version.workspace = true
edition.workspace = true
# DG-5: one integration-test binary, tests/it/ (see [[test]] below).
autotests = false
# R9.CFG1: a second bin (the PATH launcher) exists, so `cargo run -p cauldron`
# must still mean the CLI.
default-run = "cauldron"
description = "The cauldron entry point: `start`, `stop`, `status`, `build` per service per environment, and a bare `cauldron` that reaches the TUI. A CLI, not a daemon — it writes files and spawns processes, so there is no supervisor process that can itself die."

[[bin]]
name = "cauldron"
path = "src/main.rs"

# R9.CFG1 (implements E18-19): the binary meant to sit on PATH as `cauldron`.
# Reads `[cli] interface` from `<cauldron root>/config.toml` and execs that
# build with the same argv; default = the globs2 demo build.
[[bin]]
name = "cauldron-launcher"
path = "src/bin/cauldron-launcher.rs"


# Every integration test is a module of tests/it/main.rs; add new ones there,
# never as a new top-level tests/*.rs (one test binary per crate keeps build
# time and disk use down).
[[test]]
name = "it"
path = "tests/it/main.rs"

[features]
# Test-only: builds the spine's fault-injection seam into this crate's
# binaries, so a test can stop a real `cauldron soup import` at a named
# commit stage (`SPINE_FAULT=decided`) instead of racing a kill against the
# clock; and the dump removal's seam, so a test can stop `cauldron soup
# dump-remove` after any of its steps (`CAULDRON_REMOVE_FAULT=marked`). Off in
# every normal build, where a set SPINE_FAULT or CAULDRON_REMOVE_FAULT is
# refused.
#   cargo test -p cauldron --features fault-injection --test it soup
#   cargo test -p cauldron --features fault-injection --test it d7
fault-injection = ["spine/fault-injection", "soup-door/fault-injection"]

[dependencies]
env = { path = "../libs/env" }
# REL-3.S1: `env create cauldron-build` seeds the curated dataset it owns.
soup = { package = "soup-seed", path = "../libs/soup" }
# `cauldron create` makes a cauldron's soup (one `ws` pool, grammar v6)
# and `cauldron soup` opens it offline. Default features: the one-door gate
# stays closed.
spine = { path = "../libs/spine" }
# `cauldron soup` and `cauldron link` are argument parsing and printing over it.
soup-door = { path = "../libs/soup-door" }
# `rename` / `remove` read a cauldron's own `spine.db` READ-ONLY for a
# live tranche. The version and features spine already links.
rusqlite = { version = "0.31", features = ["bundled"] }
# `soup import` reads records as JSON or YAML; the version spine already links.
serde_yaml = "0.9"
# R5.S2 (DEC-34): the MCP tool host the daemon owns.
mcp-host = { path = "../libs/mcp-host" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
# R6.S6b: the self-update compares the launch path's bytes when only its ctime moved.
sha2 = { workspace = true }
# JOBS-DST: a calendar slot is a LOCAL DATE at HH:MM resolved through the
# zone's rules (`jobs::resolve_local`), which needs the offset at an instant —
# `chrono::Local` reads it from `TZ` / /etc/localtime with no `/bin/date`
# spawn and no `unsafe`. Already the workspace's time library (version above,
# in the lockfile through the tui); this adds chrono, num-traits and
# iana-time-zone to the shipped CLI.
chrono = { workspace = true }
# R9.C7: reads a declaration's `[quiet]` section out of its text.
toml = { workspace = true }
# RV1.S12a: `ctl node` reads one soup node over the soup's websocket door —
# the handshake runs over a stream `env::egress::connect_tcp` admitted (the
# lockfile already holds 0.24 through tokio-tungstenite) — and reads the
# door's outcome with shapewire's own wire types (the consumer floor: no
# tokio, no axum, no env).
tungstenite = "0.24"
shapewire = { path = "../libs/shapewire", default-features = false }
# The stdio bridge opens a session's transcript with O_NOFOLLOW and
# O_NONBLOCK, and names ELOOP: constants only, no `unsafe`. The version the
# lockfile already holds.
libc = "0.2"

# REL-6a5: the `it` binary exports CAULDRON_ISOLATED=1 at load, so every
# `cauldron` child a test spawns is isolated and refuses his real root, his
# launchd domain and his live ports (env::egress).
[dev-dependencies]
test-isolation = { path = "../testkit/test-isolation" }
# `mcp_reads`: the MCP door's read tools, called in process, against the
# `cauldron soup` verbs this crate builds, on one fixture. Dev only: the door
# is a separate service and never linked into this binary.
cauldron-mcp = { path = "../services/mcp" }

[lints.rust]
unsafe_code = "forbid"
